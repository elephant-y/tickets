spring:
     application:
       name: ticket-server   # 服务名,注册中心的 key
     cloud:
       nacos:
         discovery:
           server-addr: localhost:8848
     datasource:
         url: jdbc:mysql://localhost:3307/ticket?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
         username: root
         password: 123456 
     data:
      redis:
        host: localhost
        port: 6379
        timeout: 500ms          # 命令超时:Redis 挂了快速失败,降级立刻生效(默认 60s 会拖死所有请求)
        connect-timeout: 500ms  # 连接建立超时

ticket:
  jwt:
    secret: ticket-12306-jwt-secret-key-2026-pls-change-me
    expire-hours: 2     
  snowflake:
    worker-id: 1
  cache:
    stock-ttl-seconds: 30      # 本地缓存基础 TTL
    null-ttl-seconds: 60       # 空值标记 TTL(防穿透)
    redis-ttl-seconds: 120     # Redis 层 TTL(共享层,比本地长:多留一会减少跨实例重复回源)
    local-max-size: 1000       # 本地缓存最大条数

rocketmq:
  name-server: localhost:19876   # NameServer(9876 撞 Windows 排除段,容器映射到 19876)
  producer:
    group: ticket-producer       # 生产者组名(任意唯一字符串)