spring:
     application:
       name: ticket-server   # 服务名,注册中心的 key
     cloud:
       nacos:
         discovery:
           server-addr: localhost:8848
     datasource:
         url: jdbc:mysql://localhost:3307/ticket?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
         username: root
         password: 123456 
     data:
      redis:
        host: localhost
        port: 6379

ticket:
  jwt:
    secret: ticket-12306-jwt-secret-key-2026-pls-change-me
    expire-hours: 2     
  snowflake:
    worker-id: 1
  cache:
    stock-ttl-seconds: 30      # 余票缓存基础 TTL
    null-ttl-seconds: 60       # 空值缓存 TTL(防穿透)
    local-max-size: 1000       # 本地缓存最大条数