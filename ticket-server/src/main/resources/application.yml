spring:
     application:
       name: ticket-server   # 服务名,注册中心的 key
     cloud:
       nacos:
         discovery:
           server-addr: localhost:8848
     datasource:
         # 数据源交给 ShardingSphere:连接串指向分片配置(真实连接信息在 sharding.yaml)
         url: jdbc:shardingsphere:classpath:sharding.yaml
         driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
     data:
      redis:
        host: localhost
        port: 6379
        timeout: 500ms          # 命令超时:Redis 挂了快速失败,降级立刻生效(默认 60s 会拖死所有请求)
        connect-timeout: 500ms  # 连接建立超时

ticket:
  jwt:
    secret: ticket-12306-jwt-secret-key-2026-pls-change-me
    expire-hours: 2     
  snowflake:
    worker-id: 1
  cache:
    stock-ttl-seconds: 30      # 本地缓存基础 TTL
    null-ttl-seconds: 60       # 空值标记 TTL(防穿透)
    redis-ttl-seconds: 120     # Redis 层 TTL(共享层,比本地长:多留一会减少跨实例重复回源)
    local-max-size: 1000       # 本地缓存最大条数
  order:
    timeout-level: 5
  reconcile:
    interval-seconds: 60      # 对账周期(测试60秒,生产300)
rocketmq:
  name-server: localhost:9876    # NameServer(标准端口;Windows 排除段漂移时改映射或跑 winnat 修复)
  producer:
    group: ticket-producer       # 生产者组名(任意唯一字符串)