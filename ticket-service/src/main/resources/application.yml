server:
  port: 8085

spring:
  application:
    name: ticket-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/ticket?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: "123456"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms          # 快速失败(阶段三的降级配置随域搬迁)
      connect-timeout: 500ms

ticket:
  jwt:
    # common 的 JwtUtil 被扫描注册,需满足占位符(本服务不签发 token)
    secret: ${JWT_SECRET:ticket-12306-jwt-secret-key-2026-pls-change-me}
  snowflake:
    worker-id: 4      # user=2 train=3 server=1,本服务=4
  cache:
    stock-ttl-seconds: 30
    null-ttl-seconds: 60
    redis-ttl-seconds: 120
    local-max-size: 1000
  reconcile:
    interval-seconds: 300
