server:
  port: 8081   # 网关端口(与 ticket-server 的 8080 错开)

spring:
  application:
    name: ticket-gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      routes:
        # 更具体的路由必须排在前面:网关按声明顺序匹配,先到先得
        - id: user-service-route
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
        - id: train-service-route
          uri: lb://train-service
          predicates:
            - Path=/api/train/**
        # 注意:/api/inner/** 不在任何路由里 —— 内部接口不对用户开放(阶段十补服务间认证)
        - id: ticket-server-route      # 其余 /api/** 走单体(拆分中)
          uri: lb://ticket-server
          predicates:
            - Path=/api/**
ticket:
  jwt:
    secret: ticket-12306-jwt-secret-key-2026-pls-change-me
