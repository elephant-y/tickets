# RocketMQ Broker 配置(本地开发,单机模式)
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# 对外地址:宿主机上的客户端按它连接(本机开发 127.0.0.1)
brokerIP1 = 127.0.0.1
listenPort = 10911
namesrvAddr = rmq-namesrv:9876
autoCreateTopicEnable = true
