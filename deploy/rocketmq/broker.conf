# RocketMQ Broker 配置(本地开发,单机模式)
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# 对外地址:宿主机上的客户端按它连接(本机开发 127.0.0.1)
brokerIP1 = 127.0.0.1
# 标准端口 10911 被 Windows 排除端口段占用,本地开发临时用 20911(容器内外一致映射)
listenPort = 20911
namesrvAddr = rmq-namesrv:9876
autoCreateTopicEnable = true
