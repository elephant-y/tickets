server:
  port: 8084

spring:
  application:
    name: order-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  datasource:
    # 数据源交给 ShardingSphere(orders/order_item 分片规则在 sharding.yaml)
    # SHARDING_CONFIG 决定分片配置从哪加载:本地默认 classpath,上云注入 absolutepath:/etc/ticket/sharding.yaml
    url: jdbc:shardingsphere:${SHARDING_CONFIG:classpath:sharding.yaml}
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver

ticket:
  jwt:
    # common 的 JwtUtil 被扫描注册,满足占位符
    secret: ${JWT_SECRET:ticket-12306-jwt-secret-key-2026-pls-change-me}
  snowflake:
    worker-id: 5      # user=2 train=3 ticket=4,本服务=5
  order:
    timeout-level: 16     # 16=30分钟(生产值);压测超时场景时再临时改 5=1分钟
  reconcile:
    interval-seconds: 60

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:localhost:9876}
  producer:
    group: ticket-producer
